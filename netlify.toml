[build]
  # The Next.js app is a static export (next.config.ts: output = "export").
  base = "calculator_frontend"
  command = "npm run build"
  # `next build` writes the complete deploy, including public/wasm assets, here.
  publish = "out"

[build.environment]
  # This project has no SSR/ISR/functions. Publishing the static export directly
  # avoids the Next runtime adapter replacing the intended output directory.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
